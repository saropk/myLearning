<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Athena — Aegis</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2307070a'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='2.6' fill='%23ff8c2e'/%3E%3Ccircle cx='16' cy='16' r='5.4' fill='%23040406'/%3E%3Ccircle cx='16' cy='16' r='6.6' fill='none' stroke='%23ffd37a' stroke-width='0.9'/%3E%3C/svg%3E" />
<style>
  /* Phase 1 chrome only. The emblem here is a deliberate placeholder: ATHENA.md gives the
     real one a WebGL2 ray-marched shader built in phase 6 against design/reference.png,
     and flat CSS layering must never be mistaken for that. Colours are sampled from the
     spec's stated palette so the placeholder sits in the right key. */
  :root {
    --bg: #07070a;
    --ink: #f3e7d8;
    --ink-dim: #9c8f80;
    --line: #221c19;
    --core: #fff6e0;
    --hot: #ffd37a;
    --mid: #ff8c2e;
    --cool: #e0451c;
    --tip: #7a1e0a;
    --halo: rgb(205, 78, 32);
    --engraving: rgb(255, 178, 118);
    --intensity: 0.85;
    --spin: 26s;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    /* The chat log is the only thing that scrolls; the composer must never be pushed
       off-screen (it was, when the status panel opened). */
    height: 100%; overflow: hidden;
  }
  header, .bar, #panel { flex: 0 0 auto; }
  header {
    width: 100%; max-width: 860px; padding: 28px 20px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .wordmark {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    font-weight: 500; letter-spacing: 0.28em; font-size: 20px; color: #f3e7d8;
  }
  /* --- placeholder emblem ------------------------------------------------------ */
  .emblem {
    position: relative; width: 132px; height: 132px; flex: 0 0 auto;
    opacity: var(--intensity); transition: opacity 1.5s ease;
  }
  .emblem .halo {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, transparent 38%, var(--halo) 46%, transparent 72%);
    filter: blur(6px); opacity: 0.75; transition: background 1s ease;
  }
  .emblem .disk {
    position: absolute; left: 50%; top: 50%; width: 128px; height: 20px;
    transform: translate(-50%, -50%) rotate(-12deg);
    background: linear-gradient(90deg, var(--tip), var(--cool) 18%, var(--mid) 34%,
                var(--hot) 46%, var(--core) 50%, var(--hot) 54%, var(--mid) 66%,
                var(--cool) 82%, var(--tip));
    border-radius: 50%;
    filter: blur(1.5px) saturate(1.15);
    animation: shimmer var(--spin) linear infinite;
  }
  .emblem .ring {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px;
    transform: translate(-50%, -50%); border-radius: 50%;
    border: 1.5px solid var(--engraving); opacity: 0.55;
    box-shadow: 0 0 12px 2px rgba(255, 178, 118, 0.35);
    transition: border-color 1s ease;
  }
  .emblem .shadow {
    position: absolute; left: 50%; top: 50%; width: 40px; height: 40px;
    transform: translate(-50%, -50%); border-radius: 50%; background: #040406;
  }
  .emblem[data-speaking="true"] .ring { animation: pulse 0.9s ease-in-out infinite; }
  @keyframes shimmer { to { filter: blur(2.5px) saturate(1.35) brightness(1.08); } }
  @keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.14); opacity: 0.9; } }
  @media (prefers-reduced-motion: reduce) {
    .emblem .disk, .emblem .ring { animation: none !important; }
  }
  .placeholder-note { font-size: 11px; color: #4d443c; letter-spacing: 0.06em; }

  /* --- status bar -------------------------------------------------------------- */
  .bar {
    width: 100%; max-width: 860px; padding: 6px 20px 0;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px;
  }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px;
    color: var(--ink-dim); background: #0c0b0e; white-space: nowrap;
  }
  .chip b { color: var(--ink); font-weight: 500; }
  .chip.mic-open { border-color: #6d3a18; color: var(--engraving); }
  .spacer { flex: 1; }
  select, button {
    font: inherit; font-size: 12px; color: var(--ink); background: #0c0b0e;
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer;
  }
  button:hover, select:hover { border-color: #4a3c33; }

  /* --- chat ------------------------------------------------------------------- */
  main {
    width: 100%; max-width: 860px; flex: 1; display: flex; flex-direction: column;
    padding: 14px 20px 0; min-height: 0;
  }
  #log {
    flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
    gap: 12px; padding: 12px 2px 18px;
  }
  .msg { max-width: 76%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #171418; border: 1px solid #221c19; }
  .msg.athena { align-self: flex-start; background: #0d0c10; border: 1px solid #1b1613; }
  .msg.notice, .msg.error {
    align-self: center; max-width: 90%; background: none; border: none;
    color: var(--ink-dim); font-size: 12.5px; text-align: center;
  }
  .msg.error { color: #d9704f; }
  .msg .tag {
    display: block; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
    color: #5c5148; margin-bottom: 3px;
  }
  form { display: flex; gap: 10px; padding: 0 0 22px; }
  #input {
    flex: 1; font: inherit; color: var(--ink); background: #0c0b0e;
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
  }
  #input:focus { outline: none; border-color: #4a3c33; }
  #send { padding: 0 18px; border-radius: 10px; }
  #panel {
    display: none; max-width: 860px; width: 100%; padding: 0 20px 20px;
    font-size: 12px; color: var(--ink-dim);
  }
  #panel.open { display: block; }
  #panel pre {
    margin: 0; padding: 12px; background: #0a0a0d; border: 1px solid var(--line);
    border-radius: 8px; overflow: auto; max-height: 34vh;
  }
</style>
</head>
<body>
  <header>
    <div class="wordmark">
      <span>ATH</span>
      <div class="emblem" id="emblem" data-speaking="false">
        <div class="halo"></div>
        <div class="disk"></div>
        <div class="ring"></div>
        <div class="shadow"></div>
      </div>
      <span>ENA</span>
    </div>
    <div class="placeholder-note">placeholder emblem — WebGL2 shader lands in phase 6</div>
  </header>

  <div class="bar">
    <span class="chip">state <b id="c-state">…</b></span>
    <span class="chip">valve <b id="c-valve">…</b></span>
    <span class="chip" id="c-mic-chip">mic <b id="c-mic">closed</b></span>
    <span class="chip">brain <b id="c-brain">…</b></span>
    <span class="chip">ram <b id="c-ram">…</b></span>
    <span class="spacer"></span>
    <select id="valve-select" title="Valve level (stored in phase 1, enforced in phase 5)">
      <option value="0">0 Sealed</option>
      <option value="1">1 Questions</option>
      <option value="2">2 Redacted</option>
      <option value="3">3 Open</option>
    </select>
    <button id="toggle-panel" type="button">status</button>
  </div>

  <main>
    <div id="log" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <input id="input" placeholder='Say "Athena, initiate" to wake her…' autofocus />
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <div id="panel"><pre id="panel-body">…</pre></div>

  <script src="/ui/chat.js"></script>
</body>
</html>
